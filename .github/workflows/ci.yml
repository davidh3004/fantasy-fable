name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-ldf
    steps:
      # Action versions are managed by Dependabot (github-actions ecosystem);
      # pin to full commit SHAs for stricter supply-chain hardening.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches what developers here run.
          node-version: 22
          cache: npm
          cache-dependency-path: fantasy-ldf/package-lock.json

      # Node 22 bundles npm 10, and npm 10 insists on a nested @swc/helpers
      # entry for next-intl that npm 11 dedupes away. Dependabot writes its
      # lock files with npm 11, so every one of its pull requests failed
      # `npm ci` here on a lock file that is perfectly valid — the mismatch was
      # never about the packages being bumped. Pin the major that writes the
      # lock rather than inheriting whatever Node happens to bundle.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        # Placeholder values — the build only needs these to be present/parseable
        # (module-level Supabase URL + DB client init). No real secrets in CI.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          DIRECT_URL: postgresql://user:pass@localhost:5432/postgres

      # Informational: surfaces production (runtime) advisories without failing
      # the build on transitive ones we can't fix directly.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
